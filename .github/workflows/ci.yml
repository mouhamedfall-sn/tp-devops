name: CI/CD Pipeline - TP DevOps UCAD

# ============================================================
# DÉCLENCHEURS : ce pipeline se lance automatiquement
# - à chaque push sur la branche main
# - à chaque pull request vers main
# ============================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # JOB 1 : Build et Tests
  # Ce job installe les dépendances et exécute les tests
  # ============================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Installer Node.js version 18
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'  # Met en cache node_modules pour accélérer les builds

      # Étape 3 : Installer les dépendances npm
      - name: Install dependencies
        run: npm install

      # Étape 4 : Lancer les tests unitaires
      # Le pipeline s'arrête ici si les tests échouent
      - name: Run tests
        run: npm test

      # Étape 5 : Build de l'application (si un script build existe)
      - name: Build application
        run: npm run build --if-present

  # ============================================================
  # JOB 2 : Docker Build & Push (Bonus)
  # Ce job ne s'exécute QUE si les tests passent (needs: build-and-test)
  # et seulement sur la branche main (pas sur les pull requests)
  # ============================================================
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test  # Attend que build-and-test réussisse
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Connexion à Docker Hub avec les secrets configurés
      # (Settings → Secrets and variables → Actions dans GitHub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construction et push de l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mon-app:latest

  # ============================================================
  # JOB 3 : Déploiement via SSH (Avancé)
  # Ce job déploie l'application sur un serveur distant via SSH
  # Ne s'exécute que si build-and-test et docker réussissent
  # ============================================================
  deploy-ssh:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}         # IP ou domaine du serveur
          username: ${{ secrets.SSH_USER }}     # ex: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}   # Clé SSH privée
          script: |
            # Se connecter au serveur et mettre à jour l'application
            cd /var/www/mon-app
            git pull origin main
            npm install --production
            pm2 restart mon-app || pm2 start npm --name "mon-app" -- start
            echo "Déploiement réussi !"
